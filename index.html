<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bespoke AI — 인플루언서 컨텐츠 검수</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f2f2f0;
  --border: #e4e4e0;
  --border-strong: #ccccc8;
  --text: #1a1a18;
  --text-secondary: #6b6b67;
  --text-muted: #a0a09c;
  --accent: #1a3a5c;
  --accent-light: #e8eef5;
  --fail: #c0392b;
  --fail-bg: #fdf1f0;
  --fail-border: #f0c4c0;
  --warn: #b05c00;
  --warn-bg: #fdf5ec;
  --warn-border: #f0d8b8;
  --pass: #1a6b3c;
  --pass-bg: #f0f8f3;
  --pass-border: #b8dfc8;
  --na-bg: #f7f7f5;
  --radius: 8px;
  --radius-lg: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 340px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.main { flex: 1; padding: 2rem; overflow-y: auto; min-width: 0; }

.sidebar-header {
  padding: 1.5rem 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}

.logo { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: white; font-weight: 600;
}

.logo-text { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
.logo-sub  { font-size: 11px; color: var(--text-muted); padding-left: 36px; }

.sidebar-body { padding: 1rem 1.25rem; flex: 1; }

.field-group { margin-bottom: 1rem; }

.field-label {
  font-size: 11px; font-weight: 500; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .06em;
  margin-bottom: 5px; display: block;
}

.opt { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-muted); font-size: 10px; }

select, input[type="text"], textarea {
  width: 100%; padding: 7px 10px; font-size: 13px;
  font-family: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  outline: none; transition: border-color .15s;
}
select:focus, input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

.tab-row {
  display: flex; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 8px;
}
.tab-btn {
  flex: 1; padding: 6px; font-size: 12px; background: transparent;
  border: none; cursor: pointer; color: var(--text-secondary);
  transition: background .12s; font-family: inherit;
}
.tab-btn.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

.tc { display: none; }
.tc.active { display: block; }

.upload-zone {
  border: 1px dashed var(--border-strong); border-radius: var(--radius);
  padding: 1rem; text-align: center; color: var(--text-muted);
  font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s;
}
.upload-zone:hover { border-color: var(--accent); background: var(--accent-light); }
.upload-zone input { display: none; }
.fname { font-size: 11px; color: var(--accent); margin-top: 4px; }

.hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

.sidebar-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border); }

.run-btn {
  width: 100%; padding: 10px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.run-btn:hover { opacity: .88; }
.run-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Main */
.main-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh;
  color: var(--text-muted); gap: 8px; text-align: center;
}
.main-empty-icon {
  width: 48px; height: 48px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px; font-size: 22px;
}
.main-empty p { font-size: 13px; }
.main-empty small { font-size: 11px; }

.loading-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 40vh; gap: 12px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: 13px; color: var(--text-secondary); }

/* Results */
.result-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
}
.chip-btn { cursor: pointer; border-color: var(--accent); color: var(--accent); }
.chip-btn:hover { background: var(--accent-light); }

.summary-bar {
  padding: 10px 14px; border-radius: var(--radius-lg);
  font-size: 13px; font-weight: 500; border: 1px solid;
  display: flex; align-items: flex-start; gap: 8px; line-height: 1.5;
}
.summary-bar.fail { background: var(--fail-bg); border-color: var(--fail-border); color: var(--fail); }
.summary-bar.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
.summary-bar.ok   { background: var(--pass-bg); border-color: var(--pass-border); color: var(--pass); }

.result-section { margin-bottom: 1.5rem; }
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.section-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px;
}
.section-badge.fail  { background: var(--fail-bg);  color: var(--fail);  border: 1px solid var(--fail-border); }
.section-badge.warn  { background: var(--warn-bg);  color: var(--warn);  border: 1px solid var(--warn-border); }
.section-badge.video { background: var(--accent-light); color: var(--accent); border: 1px solid #c4d4e8; }
.section-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

.check-item {
  display: flex; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius); border: 1px solid var(--border);
  margin-bottom: 5px; background: var(--surface);
}
.check-item.fail-item   { border-color: var(--fail-border); background: var(--fail-bg); }
.check-item.manual-item { border-color: var(--warn-border); background: var(--warn-bg); }
.check-item.pass-item   { border-color: var(--pass-border); background: var(--pass-bg); }
.check-item.na-item     { background: var(--na-bg); }

.ico {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.ico.fail { background: var(--fail); color: #fff; }
.ico.warn { background: var(--warn); color: #fff; }
.ico.pass { background: var(--pass); color: #fff; }
.ico.na   { background: var(--na-bg); color: var(--text-muted); border: 1px solid var(--border); }

.ibody { flex: 1; min-width: 0; }
.ilabel  { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.idetail { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.idetail.fail { color: var(--fail); }
.idetail.warn { color: var(--warn); }
.ifound {
  font-size: 11px; color: var(--text-secondary); font-style: italic;
  margin-top: 3px; padding: 3px 7px; background: rgba(0,0,0,.03);
  border-radius: 4px; border-left: 2px solid var(--border-strong);
}

.ts-card {
  border: 1px solid var(--warn-border); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 6px; background: var(--warn-bg);
  transition: opacity .2s;
}
.ts-card.done { border-color: var(--pass-border); background: var(--pass-bg); opacity: .7; }
.ts-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.ts-label { font-size: 12px; font-weight: 500; color: var(--warn); flex: 1; }
.ts-card.done .ts-label { color: var(--pass); }
.ts-time {
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  background: rgba(176,92,0,.12); color: var(--warn); padding: 1px 6px; border-radius: 4px;
}
.ts-card.done .ts-time { background: rgba(26,107,60,.12); color: var(--pass); }
.ts-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.ts-check-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.06);
}
.ts-check-row input { cursor: pointer; }
.ts-check-row label { font-size: 11px; color: var(--text-secondary); cursor: pointer; }
.ts-card.done .ts-check-row label { text-decoration: line-through; color: var(--text-muted); }

.progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.progress-fill { height: 100%; background: var(--pass); border-radius: 2px; transition: width .3s; }

.divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

.error-bar {
  padding: 10px 14px; border-radius: var(--radius);
  background: var(--fail-bg); border: 1px solid var(--fail-border);
  color: var(--fail); font-size: 13px; margin-bottom: 1rem;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">B</div>
        <span class="logo-text">Influencer Review</span>
      </div>
      <div class="logo-sub">Bespoke AI Content Checker</div>
    </div>

    <div class="sidebar-body">
      <div class="field-group">
        <label class="field-label">국가</label>
        <select id="country">
          <option value="">선택하세요</option>
          <option value="US">US</option>
          <option value="UK">UK</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">제품</label>
        <select id="product">
          <option value="">선택하세요</option>
          <option value='Bespoke AI Refrigerator Family Hub 32"'>Bespoke AI Refrigerator Family Hub 32"</option>
          <option value='Bespoke AI Refrigerator Family Hub 9"'>Bespoke AI Refrigerator Family Hub 9"</option>
          <option value="Bespoke AI Laundry Combo(Vented)">Bespoke AI Laundry Combo (Vented)</option>
          <option value="Bespoke AI Laundry Combo(Ventless)">Bespoke AI Laundry Combo (Ventless)</option>
          <option value="Bespoke AI Dishwasher">Bespoke AI Dishwasher</option>
          <option value="Bespoke AI Slide in Range">Bespoke AI Slide in Range</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">컨텐츠</label>
        <div class="tab-row">
          <button class="tab-btn active" onclick="switchTab('link')">URL</button>
          <button class="tab-btn" onclick="switchTab('file')">파일 업로드</button>
        </div>
        <div id="tc-link" class="tc active">
          <input type="text" id="url" placeholder="https://www.instagram.com/p/...">
        </div>
        <div id="tc-file" class="tc">
          <div class="upload-zone" onclick="document.getElementById('finput').click()">
            <input type="file" id="finput" accept="video/*,image/*" onchange="onFile(event)">
            <div style="font-size:20px;margin-bottom:4px">↑</div>
            <div>영상 또는 이미지 업로드</div>
            <div id="fname" class="fname"></div>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Description <span class="opt">(선택)</span></label>
        <textarea id="desc" placeholder="해시태그 포함하여 붙여넣기" rows="3"></textarea>
        <div class="hint">해시태그 자동 검수에 활용됩니다</div>
      </div>

      <div class="field-group">
        <label class="field-label">Transcript <span class="opt">(선택)</span></label>
        <textarea id="trans" placeholder="영상 대본 또는 자막 (타임스탬프 포함 권장)" rows="5"></textarea>
        <div class="hint">타임스탬프 포함 시 영상 확인 체크리스트가 더 정확해집니다</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="run-btn" id="runbtn" onclick="runReview()">
        <span id="btn-spinner" style="display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>
        <span id="btn-text">🔍 검수 시작</span>
      </button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty">
      <div class="main-empty-icon">🔍</div>
      <p>왼쪽에서 검수 정보를 입력하고<br>검수 시작을 눌러주세요</p>
      <small>Description 또는 Transcript 중 하나 이상 필요</small>
    </div>
  </main>
</div>

<script>
const PRODUCTS = {
  'Bespoke AI Refrigerator Family Hub 32"': {
    pn: 'Bespoke AI Refrigerator Family Hub',
    features: [
      { n: 'Family Hub Screen', c: 'Feature 명을 정확하게 언급했는지' },
      { n: 'AI Food Manager', c: "UI에 'AI Food Manager'로 표기되는지 (AI Vision Inside 오류 주의)" },
      { n: 'AI Vision', c: "Gemini 언급 시 'built with Gemini' 표현을 사용했는지" },
      { n: 'Auto Open Door', c: '손에 무언가를 들고 있거나 더러운 상태로 시연했는지' },
    ]
  },
  'Bespoke AI Refrigerator Family Hub 9"': {
    pn: 'Bespoke AI Refrigerator Family Hub',
    features: [
      { n: 'Family Hub Screen', c: 'Feature 명을 정확하게 언급했는지' },
      { n: 'AI Food Manager', c: "UI에 'AI Food Manager'로 표기되는지 (AI Vision Inside 오류 주의)" },
      { n: 'AI Vision', c: "Gemini 언급 시 'built with Gemini' 표현을 사용했는지" },
      { n: 'Auto Open Door', c: '손에 무언가를 들고 있거나 더러운 상태로 시연했는지' },
    ]
  },
  'Bespoke AI Laundry Combo(Vented)': {
    pn: 'Bespoke AI Laundry Combo',
    features: [
      { n: 'AI Opti Wash & Dry Cycle', c: 'Feature 명을 정확하게 언급했는지' },
      { n: 'Super Speed Cycle', c: '정확한 시간(68분)을 언급했는지' },
    ]
  },
  'Bespoke AI Laundry Combo(Ventless)': {
    pn: 'Bespoke AI Laundry Combo',
    features: [{ n: 'AI Opti Wash & Dry Cycle', c: 'Feature 명을 정확하게 언급했는지' }]
  },
  'Bespoke AI Dishwasher':       { pn: 'Bespoke AI Dishwasher',       features: [] },
  'Bespoke AI Slide in Range':   { pn: 'Bespoke AI Slide in Range',   features: [] },
};

function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', ['link','file'][i] === t));
  ['tc-link','tc-file'].forEach((id, i) => document.getElementById(id).classList.toggle('active', i === (t==='link'?0:1)));
}
function onFile(e) {
  const f = e.target.files[0];
  document.getElementById('fname').textContent = f ? f.name : '';
}

function setLoading(on) {
  document.getElementById('runbtn').disabled = on;
  document.getElementById('btn-spinner').style.display = on ? 'inline-block' : 'none';
  document.getElementById('btn-text').textContent = on ? '검수 중...' : '🔍 검수 시작';
}

async function runReview() {
  const country = document.getElementById('country').value;
  const product = document.getElementById('product').value;
  const url     = document.getElementById('url').value.trim();
  const desc    = document.getElementById('desc').value.trim();
  const trans   = document.getElementById('trans').value.trim();

  if (!country || !product) return alert('국가와 제품을 선택해주세요.');
  if (!url && !desc && !trans) return alert('URL, Description, Transcript 중 하나 이상을 입력해주세요.');

  const pd = PRODUCTS[product] || { pn: product, features: [] };
  const featLines = pd.features.map(f => `  - ${f.n}: ${f.c}`).join('\n');

  const prompt = `당신은 삼성 인플루언서 마케팅 컨텐츠 검수 전문가입니다.

검수 대상:
- 국가: ${country}
- 제품: ${product}
- 공식 제품명: ${pd.pn}
${pd.features.length ? '- 제품 피처:\n' + featLines : ''}
${url   ? '- URL: ' + url : ''}
${desc  ? '- Description:\n' + desc : ''}
${trans ? '- Transcript:\n' + trans : ''}

아래 JSON 형식으로만 응답하세요. 마크다운 코드블록 없이 순수 JSON만 출력하세요.

{
  "summary": "한 줄 요약 (전체 판정: FAIL/주의/통과 포함)",
  "overall": "fail 또는 warn 또는 ok",
  "fail_items": [{"label":"항목명","status":"fail 또는 pass 또는 na","detail":"판단 근거","found":"발견 내용 또는 null"}],
  "manual_items": [{"label":"항목명","status":"found 또는 not_found 또는 na","detail":"판단 근거","found":"발견 내용 또는 null"}],
  "visual_checklist": [{"timestamp":"타임스탬프 또는 전체","label":"확인 항목명","instruction":"검수자가 영상에서 확인할 내용"}]
}

fail_items 순서:
1) 타 브랜드 언급 (Samsung·Bespoke 외 경쟁사)
2) Description 해시태그 (#ad #BespokeAI #Samsung #MyBespokeStory + 제품명 해시태그, Description 없으면 na)
3) 오탈자
4) 부적절한 발언·단어
5) 공식 제품명 정확성 (${pd.pn}, Transcript 없으면 na)
${pd.features.length ? '6) 피처명 정확성 (각 피처별 개별 항목)' : ''}

manual_items:
1) 절대적/최상급 표현 (all, every, always, never, best, most 등)
2) 경쟁사 기기 노출 가능성 (스마트워치, 에어팟, 휴대폰, 타사 가전 등)

visual_checklist: 텍스트로 판단 불가하여 영상을 직접 봐야 하는 항목 (UI 화면 표기, 배경 가전 브랜드, 연출 방식, Disclaimer 표시 등)`;

  setLoading(true);
  document.getElementById('main').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>AI가 검수 항목을 분석하고 있습니다...</p>
    </div>`;

  try {
    const res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `오류 (${res.status})`);

    const raw = (data.content || []).map(b => b.text || '').join('');
    const clean = raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const result = JSON.parse(clean);
    renderResult(result, { country, product });

  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div style="padding:2rem">
        <div class="error-bar">⚠️ ${e.message}</div>
        <p style="font-size:12px;color:var(--text-muted)">잠시 후 다시 시도해주세요.</p>
      </div>`;
  } finally {
    setLoading(false);
  }
}

function renderResult(d, meta) {
  const failCount   = (d.fail_items   ||[]).filter(i => i.status === 'fail').length;
  const manualCount = (d.manual_items ||[]).filter(i => i.status === 'found').length;
  const tsCount     = (d.visual_checklist||[]).length;
  const oc = d.overall==='fail'?'fail':d.overall==='warn'?'warn':'ok';
  const oi = d.overall==='fail'?'⛔':d.overall==='warn'?'⚠️':'✅';

  let h = `
    <div>
      <div class="result-meta">
        <span class="chip">${meta.country}</span>
        <span class="chip">${meta.product}</span>
        <span class="chip chip-btn" onclick="clearResult()" style="margin-left:auto">↩ 새 검수</span>
      </div>
      <div class="summary-bar ${oc}" style="margin-bottom:1.5rem">${oi} ${d.summary}</div>

      <div class="result-section">
        <div class="section-head">
          <span class="section-badge fail">✕ Auto Fail</span>
          <span class="section-count">${failCount}건 발견</span>
        </div>`;

  (d.fail_items||[]).forEach(item => {
    const cls  = item.status==='fail'?'fail-item':item.status==='pass'?'pass-item':'na-item';
    const icls = item.status==='fail'?'fail':item.status==='pass'?'pass':'na';
    const icon = item.status==='fail'?'✕':item.status==='pass'?'✓':'—';
    h += `<div class="check-item ${cls}">
      <div class="ico ${icls}">${icon}</div>
      <div class="ibody">
        <div class="ilabel">${item.label}</div>
        ${item.detail ? `<div class="idetail ${item.status==='fail'?'fail':''}">${item.detail}</div>` : ''}
        ${item.found  ? `<div class="ifound">발견: ${item.found}</div>` : ''}
      </div>
    </div>`;
  });

  h += `</div><div class="divider"></div>
    <div class="result-section">
      <div class="section-head">
        <span class="section-badge warn">△ Manual 검수</span>
        <span class="section-count">${manualCount}건 확인 필요</span>
      </div>`;

  (d.manual_items||[]).forEach(item => {
    const cls  = item.status==='found'?'manual-item':item.status==='not_found'?'pass-item':'na-item';
    const icls = item.status==='found'?'warn':item.status==='not_found'?'pass':'na';
    const icon = item.status==='found'?'△':item.status==='not_found'?'✓':'—';
    h += `<div class="check-item ${cls}">
      <div class="ico ${icls}">${icon}</div>
      <div class="ibody">
        <div class="ilabel">${item.label}</div>
        ${item.detail ? `<div class="idetail ${item.status==='found'?'warn':''}">${item.detail}</div>` : ''}
        ${item.found  ? `<div class="ifound">발견: ${item.found}</div>` : ''}
      </div>
    </div>`;
  });

  if (tsCount > 0) {
    h += `</div><div class="divider"></div>
      <div class="result-section">
        <div class="section-head">
          <span class="section-badge video">▶ 영상 직접 확인</span>
          <span class="section-count" id="ts-progress">0 / ${tsCount} 완료</span>
        </div>
        <div class="hint" style="margin-bottom:8px">해당 타임스탬프 구간을 영상에서 직접 확인 후 체크하세요</div>
        <div class="progress-bar"><div class="progress-fill" id="ts-bar" style="width:0%"></div></div>`;

    (d.visual_checklist||[]).forEach((item, i) => {
      h += `<div class="ts-card" id="tsc${i}">
        <div class="ts-top">
          <span class="ts-label">${item.label}</span>
          <span class="ts-time">${item.timestamp}</span>
        </div>
        <div class="ts-body">${item.instruction}</div>
        <div class="ts-check-row">
          <input type="checkbox" id="tschk${i}" onchange="updateTS(${i},${tsCount})">
          <label for="tschk${i}">확인 완료</label>
        </div>
      </div>`;
    });
  }

  h += `</div></div>`;
  document.getElementById('main').innerHTML = h;
}

function updateTS(i, total) {
  document.getElementById('tsc'+i).classList.toggle('done', document.getElementById('tschk'+i).checked);
  const done = document.querySelectorAll('[id^="tschk"]:checked').length;
  document.getElementById('ts-progress').textContent = `${done} / ${total} 완료`;
  document.getElementById('ts-bar').style.width = (done / total * 100) + '%';
}

function clearResult() {
  document.getElementById('main').innerHTML = `
    <div class="main-empty">
      <div class="main-empty-icon">🔍</div>
      <p>왼쪽에서 검수 정보를 입력하고<br>검수 시작을 눌러주세요</p>
      <small>Description 또는 Transcript 중 하나 이상 필요</small>
    </div>`;
}
</script>
</body>
</html>
