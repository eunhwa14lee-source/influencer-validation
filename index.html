<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bespoke AI — 인플루언서 컨텐츠 검수</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --bg:#f7f7f5;--surface:#fff;--surface-2:#f2f2f0;--border:#e4e4e0;--border-strong:#ccccc8;
  --text:#1a1a18;--text-secondary:#6b6b67;--text-muted:#a0a09c;
  --accent:#1a3a5c;--accent-light:#e8eef5;
  --fail:#c0392b;--fail-bg:#fdf1f0;--fail-border:#f0c4c0;
  --warn:#b05c00;--warn-bg:#fdf5ec;--warn-border:#f0d8b8;
  --pass:#1a6b3c;--pass-bg:#f0f8f3;--pass-border:#b8dfc8;
  --na-bg:#f7f7f5;--radius:8px;--radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:340px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;padding:2rem;overflow-y:auto;min-width:0}
.sidebar-header{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600}
.logo-text{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.logo-sub{font-size:11px;color:var(--text-muted);padding-left:36px}
.sidebar-body{padding:1rem 1.25rem;flex:1}
.field-group{margin-bottom:1rem}
.field-label{font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.opt{font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);font-size:10px}
select,input[type="text"],textarea{width:100%;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);outline:none;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.tab-row{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.tab-btn{flex:1;padding:6px;font-size:12px;background:transparent;border:none;cursor:pointer;color:var(--text-secondary);transition:background .12s;font-family:inherit}
.tab-btn.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.tc{display:none}.tc.active{display:block}
.upload-zone{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:1rem;text-align:center;color:var(--text-muted);font-size:12px;cursor:pointer;transition:border-color .15s,background .15s}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-light)}
.upload-zone.has-file{border-color:var(--pass);background:var(--pass-bg)}
.upload-zone input{display:none}
.fname{font-size:11px;color:var(--pass);margin-top:4px;font-weight:500}
.hint{font-size:11px;color:var(--text-muted);margin-top:3px}
.hint-accent{font-size:11px;color:var(--accent);margin-top:3px}
.frames-preview{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.frame-thumb{width:42px;height:28px;border-radius:3px;object-fit:cover;border:1px solid var(--border)}
.frame-progress{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.frame-progress-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.frame-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid var(--border)}
.run-btn{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.run-btn:hover{opacity:.88}.run-btn:disabled{opacity:.4;cursor:not-allowed}
.main-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--text-muted);gap:8px;text-align:center}
.main-empty-icon{width:48px;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;font-size:22px}
.main-empty p{font-size:13px}.main-empty small{font-size:11px}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:12px}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state p{font-size:13px;color:var(--text-secondary)}
.loading-state small{font-size:11px;color:var(--text-muted)}
.result-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)}
.chip-btn{cursor:pointer;border-color:var(--accent);color:var(--accent)}.chip-btn:hover{background:var(--accent-light)}
.chip-video{border-color:var(--pass);color:var(--pass);background:var(--pass-bg)}
.summary-bar{padding:10px 14px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;border:1px solid;display:flex;align-items:flex-start;gap:8px;line-height:1.5;margin-bottom:1.5rem}
.summary-bar.fail{background:var(--fail-bg);border-color:var(--fail-border);color:var(--fail)}
.summary-bar.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.summary-bar.ok{background:var(--pass-bg);border-color:var(--pass-border);color:var(--pass)}
.result-section{margin-bottom:1.5rem}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
.section-badge.fail{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail-border)}
.section-badge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.section-badge.video{background:var(--accent-light);color:var(--accent);border:1px solid #c4d4e8}
.section-count{font-size:12px;color:var(--text-muted);margin-left:auto}
.check-item{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:5px;background:var(--surface)}
.check-item.fail-item{border-color:var(--fail-border);background:var(--fail-bg)}
.check-item.manual-item{border-color:var(--warn-border);background:var(--warn-bg)}
.check-item.pass-item{border-color:var(--pass-border);background:var(--pass-bg)}
.check-item.na-item{background:var(--na-bg)}
.ico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.ico.fail{background:var(--fail);color:#fff}.ico.warn{background:var(--warn);color:#fff}
.ico.pass{background:var(--pass);color:#fff}.ico.na{background:var(--na-bg);color:var(--text-muted);border:1px solid var(--border)}
.ibody{flex:1;min-width:0}
.ilabel{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.idetail{font-size:12px;color:var(--text-secondary);line-height:1.5}
.idetail.fail{color:var(--fail)}.idetail.warn{color:var(--warn)}
.ifound{font-size:11px;color:var(--text-secondary);font-style:italic;margin-top:3px;padding:3px 7px;background:rgba(0,0,0,.03);border-radius:4px;border-left:2px solid var(--border-strong)}
.ts-card{border:1px solid var(--warn-border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;background:var(--warn-bg);transition:opacity .2s}
.ts-card.done{border-color:var(--pass-border);background:var(--pass-bg);opacity:.7}
.ts-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ts-label{font-size:12px;font-weight:500;color:var(--warn);flex:1}
.ts-card.done .ts-label{color:var(--pass)}
.ts-time{font-size:10px;font-family:'JetBrains Mono',monospace;background:rgba(176,92,0,.12);color:var(--warn);padding:1px 6px;border-radius:4px}
.ts-card.done .ts-time{background:rgba(26,107,60,.12);color:var(--pass)}
.ts-body{font-size:12px;color:var(--text-secondary);line-height:1.5}
.ts-check-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06)}
.ts-check-row input{cursor:pointer}
.ts-check-row label{font-size:11px;color:var(--text-secondary);cursor:pointer}
.ts-card.done .ts-check-row label{text-decoration:line-through;color:var(--text-muted)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:var(--pass);border-radius:2px;transition:width .3s}
.divider{height:1px;background:var(--border);margin:1.25rem 0}
.error-bar{padding:10px 14px;border-radius:var(--radius);background:var(--fail-bg);border:1px solid var(--fail-border);color:var(--fail);font-size:13px;margin-bottom:1rem}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo"><div class="logo-mark">B</div><span class="logo-text">Influencer Review</span></div>
      <div class="logo-sub">Bespoke AI Content Checker</div>
    </div>
    <div class="sidebar-body">
      <div class="field-group">
        <label class="field-label">국가</label>
        <select id="country">
          <option value="">선택하세요</option>
          <option value="US">US</option>
          <option value="UK">UK</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">제품</label>
        <select id="product">
          <option value="">선택하세요</option>
          <option value='Bespoke AI Refrigerator Family Hub 32"'>Bespoke AI Refrigerator Family Hub 32"</option>
          <option value='Bespoke AI Refrigerator Family Hub 9"'>Bespoke AI Refrigerator Family Hub 9"</option>
          <option value="Bespoke AI Laundry Combo(Vented)">Bespoke AI Laundry Combo (Vented)</option>
          <option value="Bespoke AI Laundry Combo(Ventless)">Bespoke AI Laundry Combo (Ventless)</option>
          <option value="Bespoke AI Dishwasher">Bespoke AI Dishwasher</option>
          <option value="Bespoke AI Slide in Range">Bespoke AI Slide in Range</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">컨텐츠</label>
        <div class="tab-row">
          <button class="tab-btn active" onclick="switchTab('link')">URL</button>
          <button class="tab-btn" onclick="switchTab('file')">영상 업로드</button>
        </div>
        <div id="tc-link" class="tc active">
          <input type="text" id="url" placeholder="https://www.instagram.com/p/...">
          <div class="hint">URL 입력 시 텍스트 기반 검수만 진행됩니다</div>
        </div>
        <div id="tc-file" class="tc">
          <div class="upload-zone" id="upload-zone" onclick="document.getElementById('finput').click()">
            <input type="file" id="finput" accept="video/*" onchange="onVideoSelect(event)">
            <div style="font-size:20px;margin-bottom:4px">🎬</div>
            <div>영상 파일 업로드</div>
            <div style="font-size:10px;margin-top:2px">장면 변화 자동 감지</div>
            <div id="fname" class="fname"></div>
          </div>
          <div id="frames-wrap" style="display:none">
            <div class="frame-progress">
              <span id="frame-status">분석 중...</span>
              <div class="frame-progress-bar"><div class="frame-progress-fill" id="frame-bar" style="width:0%"></div></div>
            </div>
            <div class="frames-preview" id="frames-preview"></div>
          </div>
          <div class="hint-accent" id="frame-hint" style="display:none">✓ 영상 분석이 자동으로 포함됩니다</div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Description <span class="opt">(선택)</span></label>
        <textarea id="desc" placeholder="해시태그 포함하여 붙여넣기" rows="3"></textarea>
        <div class="hint">해시태그 자동 검수에 활용됩니다</div>
      </div>
      <div class="field-group">
        <label class="field-label">Transcript <span class="opt">(선택)</span></label>
        <textarea id="trans" placeholder="영상 대본 또는 자막 (타임스탬프 포함 권장)" rows="4"></textarea>
        <div class="hint">타임스탬프 포함 시 더 정확한 검수가 가능합니다</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="run-btn" id="runbtn" onclick="runReview()">
        <span id="btn-spinner" style="display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>
        <span id="btn-text">🔍 검수 시작</span>
      </button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty">
      <div class="main-empty-icon">🔍</div>
      <p>왼쪽에서 검수 정보를 입력하고<br>검수 시작을 눌러주세요</p>
      <small>영상 업로드 시 장면 변화를 감지해 자동 분석합니다</small>
    </div>
  </main>
</div>

<video id="hidden-video" style="display:none" crossorigin="anonymous" muted playsinline></video>
<canvas id="hidden-canvas" style="display:none"></canvas>

  '경쟁사 제품 노출 (크롭·줌인·재촬영으로 보이지 않게 할 것)',
  '영상 내 #ad 또는 #samsungpartner 텍스트 오버레이 사용 여부',
  '영상 싱크와 자막이 맞지 않는 경우',

const COMMON_MANUAL = [
  '경쟁사가 아니더라도 다른 브랜드 로고가 노골적으로 드러나는 경우',
  'Disclaimer 크기가 화면의 1/5 이상 차지',
  '명령·버튼 조작 이후 실제 실행까지 딜레이가 느껴지는 경우',
  '모자이크가 너무 눈에 띄는 경우',
  '카메라 보고 말하는 목소리와 나레이션 볼륨이 일관되지 않은 경우',
  'all, every, always, never 및 최상급 표현 사용',
  'footage가 다양하지 않은 경우',
  '스마트워치, 에어팟, 휴대폰 노출'
];

let extractedFrames = [];

function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['link','file'][i] === t));
  ['tc-link','tc-file'].forEach((id,i) => document.getElementById(id).classList.toggle('active', i === (t==='link'?0:1)));
}

function onVideoSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('fname').textContent = file.name;
  document.getElementById('upload-zone').classList.add('has-file');
  document.getElementById('frames-wrap').style.display = 'block';
  document.getElementById('frame-hint').style.display = 'none';
  document.getElementById('frames-preview').innerHTML = '';
  extractedFrames = [];
  extractFramesWithSceneDetection(file).then(() => {
    document.getElementById('frame-status').textContent = `✓ ${extractedFrames.length}개 장면 감지 완료`;
    document.getElementById('frame-bar').style.width = '100%';
    document.getElementById('frame-hint').style.display = 'block';
  }).catch((err) => {
    console.error(err);
    document.getElementById('frame-status').textContent = '프레임 추출 실패 — 텍스트 검수로 진행';
  });
}

// ── 장면 변화 감지 기반 프레임 추출 ──
function extractFramesWithSceneDetection(file) {
  return new Promise((resolve, reject) => {
    const video = document.getElementById('hidden-video');
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d');
    const url = URL.createObjectURL(file);

    // 이미지 크기 및 품질 조정 (Vercel 4.5MB 제한 대응)
    const TARGET_WIDTH = 400;
    const JPEG_QUALITY = 0.55;

    // 장면 감지 파라미터
    const SAMPLE_INTERVAL = 0.5;    // 0.5초 간격으로 샘플링
    const SCENE_THRESHOLD = 25;      // 히스토그램 차이 임계값
    const MIN_FRAMES = 8;            // 최소 프레임 수
    const MAX_FRAMES = 20;           // 최대 프레임 수 (Vercel 제한 고려)

    video.src = url;
    video.onloadedmetadata = async () => {
      const duration = video.duration;
      canvas.width = TARGET_WIDTH;
      canvas.height = Math.round(TARGET_WIDTH * (video.videoHeight / video.videoWidth)) || 225;

      const samples = [];
      const totalSamples = Math.min(Math.floor(duration / SAMPLE_INTERVAL), 120);

      // 1단계: 균등 샘플링하며 히스토그램 계산
      for (let i = 0; i < totalSamples; i++) {
        const t = (duration / totalSamples) * i + 0.1;
        await seekTo(video, t);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const hist = calcHistogram(imgData);
        samples.push({ time: t, hist, dataUrl: canvas.toDataURL('image/jpeg', JPEG_QUALITY) });

        document.getElementById('frame-status').textContent = `장면 분석 중... (${i+1}/${totalSamples})`;
        document.getElementById('frame-bar').style.width = ((i+1) / totalSamples * 60) + '%';
      }

      // 2단계: 장면 변화 지점 찾기
      const sceneChanges = [0]; // 첫 프레임 항상 포함
      for (let i = 1; i < samples.length; i++) {
        const diff = histogramDiff(samples[i-1].hist, samples[i].hist);
        if (diff > SCENE_THRESHOLD) {
          sceneChanges.push(i);
        }
      }

      // 3단계: 프레임 수 조정
      let selectedIndices = sceneChanges;

      if (selectedIndices.length < MIN_FRAMES) {
        // 부족하면 균등 간격으로 채우기
        const step = Math.floor(samples.length / MIN_FRAMES);
        selectedIndices = [];
        for (let i = 0; i < samples.length; i += step) {
          if (selectedIndices.length < MIN_FRAMES) selectedIndices.push(i);
        }
      } else if (selectedIndices.length > MAX_FRAMES) {
        // 너무 많으면 균등 샘플링
        const step = selectedIndices.length / MAX_FRAMES;
        selectedIndices = Array.from({length: MAX_FRAMES}, (_, i) => selectedIndices[Math.floor(i * step)]);
      }

      // 4단계: 선택된 프레임 저장
      const preview = document.getElementById('frames-preview');
      for (let i = 0; i < selectedIndices.length; i++) {
        const sample = samples[selectedIndices[i]];
        extractedFrames.push({
          base64: sample.dataUrl.split(',')[1],
          time: Math.round(sample.time)
        });

        const img = document.createElement('img');
        img.src = sample.dataUrl;
        img.className = 'frame-thumb';
        img.title = `${Math.round(sample.time)}s`;
        preview.appendChild(img);

        document.getElementById('frame-bar').style.width = (60 + (i+1) / selectedIndices.length * 40) + '%';
      }

      URL.revokeObjectURL(url);
      resolve();
    };
    video.onerror = reject;
  });
}

function seekTo(video, t) {
  return new Promise(res => {
    const onSeeked = () => { video.removeEventListener('seeked', onSeeked); res(); };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

// 32-bin 밝기 히스토그램
function calcHistogram(imgData) {
  const hist = new Array(32).fill(0);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
    const bin = Math.min(31, Math.floor(brightness / 8));
    hist[bin]++;
  }
  const total = data.length / 4;
  return hist.map(v => v / total * 100);
}

function histogramDiff(h1, h2) {
  let diff = 0;
  for (let i = 0; i < h1.length; i++) diff += Math.abs(h1[i] - h2[i]);
  return diff;
}

function setLoading(on, msg) {
  document.getElementById('runbtn').disabled = on;
  document.getElementById('btn-spinner').style.display = on ? 'inline-block' : 'none';
  document.getElementById('btn-text').textContent = on ? (msg || '검수 중...') : '🔍 검수 시작';
}

async function runReview() {
  const country = document.getElementById('country').value;
  const product = document.getElementById('product').value;
  const url     = document.getElementById('url').value.trim();
  const desc    = document.getElementById('desc').value.trim();
  const trans   = document.getElementById('trans').value.trim();
  const hasVideo = extractedFrames.length > 0;

  if (!country || !product) return alert('국가와 제품을 선택해주세요.');
  if (!url && !desc && !trans && !hasVideo) return alert('URL, 영상, Description, Transcript 중 하나 이상을 입력해주세요.');

  const pd = PRODUCTS[product] || { pn: product, features: [] };

  const prompt = `당신은 삼성 인플루언서 마케팅 컨텐츠 검수 전문가입니다.

## 검수 대상
- 국가: ${country}
- 제품: ${product}
- 공식 제품명: ${pd.pn}
${url ? '- URL: ' + url : ''}
${desc ? '- Description:\n' + desc : ''}
${trans ? '- Transcript:\n' + trans : ''}
${hasVideo ? `- 영상 프레임 ${extractedFrames.length}개 (장면 변화 감지 기반 추출, 타임스탬프: ${extractedFrames.map(f=>f.time+'s').join(', ')})` : ''}

## 제품 피처
${pd.features.length > 0 ? pd.features.map(f => `  - ${f.n} (${f.check_type}): ${f.notes}`).join('\n') : '없음'}

## 공통 Auto Fail 기준
${COMMON_FAIL.map((v,i) => `${i+1}. ${v}`).join('\n')}

## 공통 Manual 검수 기준
${COMMON_MANUAL.map((v,i) => `${i+1}. ${v}`).join('\n')}

## 판단 기준
- check_type이 'text'인 피처: 텍스트로 판단 → fail_items
- check_type이 'visual'인 피처: 영상으로 판단 → visual_items (프레임 없으면 visual_checklist)
- check_type이 'visual_and_text': 텍스트 부분은 fail_items, 영상 부분은 visual_items
- Manual 기준 중 텍스트로 판단 가능한 항목: manual_items
- Manual 기준 중 영상으로만 판단 가능한 항목: visual_items 또는 visual_checklist

순수 JSON만 출력. 마크다운 없이.

{
  "summary": "한 줄 요약",
  "overall": "fail 또는 warn 또는 ok",
  "fail_items": [{"label":"","status":"fail 또는 pass 또는 na","detail":"","found":null 또는 문자열}],
  "manual_items": [{"label":"","status":"found 또는 not_found 또는 na","detail":"","found":null 또는 문자열}],
  "visual_items": [{"label":"","status":"fail 또는 pass 또는 na","detail":"","found":null 또는 문자열,"timestamp":null 또는 문자열}],
  "visual_checklist": [{"timestamp":"","label":"","instruction":""}]
}`;

  setLoading(true, hasVideo ? '영상 분석 중...' : '검수 중...');
  document.getElementById('main').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>${hasVideo ? '영상 프레임을 분석하고 있습니다...' : 'AI가 검수 항목을 분석하고 있습니다...'}</p>
      <small>${hasVideo ? `${extractedFrames.length}개 장면 + 텍스트 동시 분석` : 'Transcript · Description 기반 검수'}</small>
    </div>`;

  try {
    const messageContent = hasVideo
      ? [
          { type: 'text', text: prompt },
          ...extractedFrames.map(f => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: f.base64 } })),
          { type: 'text', text: `위는 장면 변화 감지로 추출한 ${extractedFrames.length}개 프레임입니다.` }
        ]
      : prompt;

    const res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 4000, messages: [{ role: 'user', content: messageContent }] })
    });

    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(`서버 응답 오류: ${text.slice(0, 150)}`);
    }

    if (!res.ok) throw new Error(data?.error || `오류 (${res.status})`);

    const raw = (data.content || []).map(b => b.text || '').join('');
    const clean = raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const result = JSON.parse(clean);
    renderResult(result, { country, product, hasVideo });

  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div style="padding:2rem">
        <div class="error-bar">⚠️ ${e.message}</div>
        <p style="font-size:12px;color:var(--text-muted)">잠시 후 다시 시도해주세요.</p>
      </div>`;
  } finally {
    setLoading(false);
  }
}

function renderResult(d, meta) {
  const failCount = (d.fail_items||[]).filter(i => i.status === 'fail').length;
  const manualCount = (d.manual_items||[]).filter(i => i.status === 'found').length;
  const visualFailCount = (d.visual_items||[]).filter(i => i.status === 'fail').length;
  const tsCount = (d.visual_checklist||[]).length;
  const oc = d.overall==='fail'?'fail':d.overall==='warn'?'warn':'ok';
  const oi = d.overall==='fail'?'⛔':d.overall==='warn'?'⚠️':'✅';

  let h = `<div>
    <div class="result-meta">
      <span class="chip">${meta.country}</span>
      <span class="chip">${meta.product}</span>
      ${meta.hasVideo ? '<span class="chip chip-video">🎬 영상 분석 포함</span>' : ''}
      <span class="chip chip-btn" onclick="clearResult()" style="margin-left:auto">↩ 새 검수</span>
    </div>
    <div class="summary-bar ${oc}">${oi} ${d.summary}</div>`;

  h += `<div class="result-section">
    <div class="section-head">
      <span class="section-badge fail">✕ Auto Fail</span>
      <span class="section-count">${failCount}건 발견</span>
    </div>`;
  (d.fail_items||[]).forEach(item => {
    const cls = item.status==='fail'?'fail-item':item.status==='pass'?'pass-item':'na-item';
    const icls = item.status==='fail'?'fail':item.status==='pass'?'pass':'na';
    const icon = item.status==='fail'?'✕':item.status==='pass'?'✓':'—';
    h += `<div class="check-item ${cls}"><div class="ico ${icls}">${icon}</div><div class="ibody">
      <div class="ilabel">${item.label}</div>
      ${item.detail?`<div class="idetail ${item.status==='fail'?'fail':''}">${item.detail}</div>`:''}
      ${item.found?`<div class="ifound">발견: ${item.found}</div>`:''}
    </div></div>`;
  });
  h += `</div><div class="divider"></div>`;

  h += `<div class="result-section">
    <div class="section-head">
      <span class="section-badge warn">△ Manual 검수</span>
      <span class="section-count">${manualCount}건 확인 필요</span>
    </div>`;
  (d.manual_items||[]).forEach(item => {
    const cls = item.status==='found'?'manual-item':item.status==='not_found'?'pass-item':'na-item';
    const icls = item.status==='found'?'warn':item.status==='not_found'?'pass':'na';
    const icon = item.status==='found'?'△':item.status==='not_found'?'✓':'—';
    h += `<div class="check-item ${cls}"><div class="ico ${icls}">${icon}</div><div class="ibody">
      <div class="ilabel">${item.label}</div>
      ${item.detail?`<div class="idetail ${item.status==='found'?'warn':''}">${item.detail}</div>`:''}
      ${item.found?`<div class="ifound">발견: ${item.found}</div>`:''}
    </div></div>`;
  });
  h += `</div>`;

  if (meta.hasVideo && d.visual_items && d.visual_items.length > 0) {
    h += `<div class="divider"></div>
    <div class="result-section">
      <div class="section-head">
        <span class="section-badge video">🎬 영상 분석 결과</span>
        <span class="section-count">${visualFailCount}건 발견</span>
      </div>`;
    d.visual_items.forEach(item => {
      const cls = item.status==='fail'?'fail-item':item.status==='pass'?'pass-item':'na-item';
      const icls = item.status==='fail'?'fail':item.status==='pass'?'pass':'na';
      const icon = item.status==='fail'?'✕':item.status==='pass'?'✓':'—';
      h += `<div class="check-item ${cls}"><div class="ico ${icls}">${icon}</div><div class="ibody">
        <div class="ilabel">${item.label}${item.timestamp?` <span style="font-size:10px;color:var(--text-muted);font-weight:400">(${item.timestamp})</span>`:''}</div>
        ${item.detail?`<div class="idetail ${item.status==='fail'?'fail':''}">${item.detail}</div>`:''}
        ${item.found?`<div class="ifound">발견: ${item.found}</div>`:''}
      </div></div>`;
    });
    h += `</div>`;
  }

  if (tsCount > 0) {
    h += `<div class="divider"></div>
    <div class="result-section">
      <div class="section-head">
        <span class="section-badge video">▶ 추가 확인 필요</span>
        <span class="section-count" id="ts-progress">0 / ${tsCount} 완료</span>
      </div>
      <div class="hint" style="margin-bottom:8px">영상을 직접 확인 후 체크해주세요</div>
      <div class="progress-bar"><div class="progress-fill" id="ts-bar" style="width:0%"></div></div>`;
    (d.visual_checklist||[]).forEach((item, i) => {
      h += `<div class="ts-card" id="tsc${i}">
        <div class="ts-top"><span class="ts-label">${item.label}</span><span class="ts-time">${item.timestamp}</span></div>
        <div class="ts-body">${item.instruction}</div>
        <div class="ts-check-row"><input type="checkbox" id="tschk${i}" onchange="updateTS(${i},${tsCount})"><label for="tschk${i}">확인 완료</label></div>
      </div>`;
    });
    h += `</div>`;
  }

  h += `</div>`;
  document.getElementById('main').innerHTML = h;
}

function updateTS(i, total) {
  document.getElementById('tsc'+i).classList.toggle('done', document.getElementById('tschk'+i).checked);
  const done = document.querySelectorAll('[id^="tschk"]:checked').length;
  document.getElementById('ts-progress').textContent = `${done} / ${total} 완료`;
  document.getElementById('ts-bar').style.width = (done / total * 100) + '%';
}

function clearResult() {
  extractedFrames = [];
  document.getElementById('main').innerHTML = `
    <div class="main-empty">
      <div class="main-empty-icon">🔍</div>
      <p>왼쪽에서 검수 정보를 입력하고<br>검수 시작을 눌러주세요</p>
      <small>영상 업로드 시 장면 변화를 감지해 자동 분석합니다</small>
    </div>`;
}
